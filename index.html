<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Phuttuuuuuu 💗</title>
<style>
:root {
  --pink-50: #fff7fb;
  --pink-100: #ffeaf3;
  --pink-200: #ffd1e2;
  --pink-300: #ffacc8;
  --pink-500: #ff6f9d;
  --pink-600: #ef4b82;
  --rose: #d93268;
  --blue-50: #f3f7ff;
  --blue-200: #d7e5ff;
  --blue-500: #79a9ff;
  --ink: #3a2940;
  --muted: #806a7d;
  --white: #fff;
  --shadow: 0 22px 60px rgba(177, 78, 122, .18);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color: var(--ink);
  background: var(--pink-50);
}
#app {
  min-height: 100vh;
  background: light-dark(#fff8fc, #241927);
  overflow: hidden;
}
body::selection { background: var(--pink-200); }
button { font: inherit; }

.scene {
  min-height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 26px 16px 36px;
  isolation: isolate;
}
.scene::before,
.scene::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(3px);
  opacity: .65;
  z-index: -2;
}
.scene::before {
  width: 310px; height: 310px;
  background: radial-gradient(circle, #ffd6e8 0%, rgba(255,214,232,0) 68%);
  left: -120px; top: 10%;
}
.scene::after {
  width: 360px; height: 360px;
  background: radial-gradient(circle, #dfeaff 0%, rgba(223,234,255,0) 68%);
  right: -150px; bottom: 2%;
}

.dots { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.dot {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255, 111, 157, .3);
  animation: float 6s ease-in-out infinite;
}
.dot:nth-child(1) { left: 8%; top: 17%; animation-delay: 0s; }
.dot:nth-child(2) { left: 79%; top: 14%; animation-delay: -1s; }
.dot:nth-child(3) { left: 90%; top: 58%; animation-delay: -3s; }
.dot:nth-child(4) { left: 18%; top: 82%; animation-delay: -2s; }
.dot:nth-child(5) { left: 52%; top: 8%; width: 6px; height: 6px; animation-delay: -4s; }
.dot:nth-child(6) { left: 57%; top: 92%; width: 10px; height: 10px; animation-delay: -5s; }
@keyframes float { 50% { transform: translateY(-18px) translateX(7px); } }

.card {
  width: min(860px, 100%);
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.96);
  border-radius: 36px;
  padding: 28px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.8), transparent 48%, rgba(221,232,255,.25));
  pointer-events: none;
}
.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 10px;
  position: relative;
  z-index: 2;
}
.brand { font-weight: 900; letter-spacing: .04em; color: var(--rose); }
.progress {
  font-size: 12px;
  background: var(--pink-100);
  border: 1px solid var(--pink-200);
  padding: 7px 11px;
  border-radius: 999px;
  color: var(--rose);
  font-weight: 800;
}

.bears {
  display: flex;
  justify-content: center;
  align-items: end;
  gap: 16px;
  margin: 18px 0 14px;
  height: 150px;
  position: relative;
  z-index: 2;
}
.bear { position: relative; width: 108px; height: 130px; }
.bear .ear { position: absolute; width: 28px; height: 28px; border-radius: 50%; top: 1px; background: #c48d7d; border: 4px solid #935d5b; }
.bear .ear.left { left: 9px; }
.bear .ear.right { right: 9px; }
.bear .head { position: absolute; width: 92px; height: 90px; border-radius: 48% 48% 45% 45%; left: 8px; top: 12px; background: #e8b9a3; border: 4px solid #9d625c; box-shadow: inset -7px -8px rgba(157,98,92,.08); }
.bear.blue .head { background: #c9ddff; border-color: #668fd7; }
.bear.blue .ear { background: #abc8fb; border-color: #668fd7; }
.bear .muzzle { position: absolute; width: 52px; height: 38px; background: #f9ded0; border-radius: 50%; left: 20px; top: 54px; }
.bear.blue .muzzle { background: #eff5ff; }
.eye { position: absolute; width: 8px; height: 11px; border-radius: 50%; background: #3e3040; top: 43px; }
.eye.left { left: 27px; } .eye.right { right: 27px; }
.nose { position: absolute; width: 11px; height: 8px; border-radius: 60% 60% 45% 45%; background: #573949; left: 40px; top: 67px; }
.smile { position: absolute; width: 20px; height: 10px; border-bottom: 3px solid #573949; border-radius: 0 0 20px 20px; left: 36px; top: 74px; }
.body { position: absolute; width: 74px; height: 56px; left: 17px; top: 86px; border-radius: 40px 40px 28px 28px; background: #f6bed3; border: 4px solid #b75f85; }
.blue .body { background: #8fb6ff; border-color: #6184c4; }
.arm { position: absolute; width: 23px; height: 42px; border-radius: 20px; top: 91px; background: #e8b9a3; border: 4px solid #9d625c; transform-origin: top center; }
.blue .arm { background: #c9ddff; border-color: #668fd7; }
.arm.left { left: 3px; transform: rotate(22deg); } .arm.right { right: 1px; transform: rotate(-22deg); }
.heart { position: absolute; font-size: 22px; top: -12px; right: -7px; animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { transform: scale(1.15); } }

.kicker {
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  color: var(--pink-600);
  letter-spacing: .12em;
  text-transform: uppercase;
  position: relative;
  z-index: 2;
}
h1 {
  text-align: center;
  font-size: clamp(34px, 7vw, 62px);
  line-height: 1.03;
  margin: 10px auto 14px;
  max-width: 760px;
  position: relative;
  z-index: 2;
  color: #42253d;
}
.sub {
  text-align: center;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.6;
  max-width: 620px;
  margin: 0 auto 24px;
  position: relative;
  z-index: 2;
}
.name { color: var(--rose); }

.actions {
  min-height: 138px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  z-index: 3;
}
.btn {
  border: 0;
  cursor: pointer;
  border-radius: 18px;
  padding: 15px 28px;
  font-weight: 900;
  transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  box-shadow: 0 12px 30px rgba(93, 58, 75, .14);
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.yes { background: linear-gradient(135deg, #ff75a4, #ff4e8f); color: #fff; }
.btn.no { background: #fff; color: #6b5262; border: 1px solid #eddce5; }
.actions.dodge-zone .btn.no { position: fixed; left: 62%; top: 62%; z-index: 50; }

.hint {
  margin-top: 12px;
  text-align: center;
  font-size: 12px;
  color: #9f8997;
  min-height: 18px;
}
.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  max-width: 700px;
  margin: 12px auto 12px;
  position: relative;
  z-index: 3;
}
.choice {
  min-height: 96px;
  background: #fff;
  border: 2px solid #f2dfe8;
  border-radius: 26px;
  font-weight: 900;
  color: #4c3848;
  cursor: pointer;
  box-shadow: 0 14px 32px rgba(93,58,75,.08);
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
.choice:hover { transform: translateY(-4px); border-color: var(--pink-300); }
.choice.me { background: linear-gradient(135deg, #fff1f7, #fff); }
.choice.rain { background: linear-gradient(135deg, #f1f6ff, #fff); }
.emoji { display:block; font-size: 30px; margin-bottom: 5px; }

.back {
  margin-top: 14px;
  background: transparent;
  border: 0;
  color: #846b7d;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.gift-wrap { position: relative; margin: 20px auto 25px; width: min(300px, 80vw); height: 210px; }
.gift {
  position: absolute;
  width: 230px; height: 150px;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  border-radius: 12px 12px 20px 20px;
  background: linear-gradient(135deg, #ff9fbe, #ff6e9f);
  border: 5px solid #d84b7e;
  box-shadow: 0 18px 38px rgba(216,75,126,.22);
  cursor: pointer;
}
.gift::before { content:""; position:absolute; left:50%; top:0; width: 30px; height:100%; transform:translateX(-50%); background:#ffd1e2; }
.gift::after { content:""; position:absolute; left:0; top:48px; width:100%; height:30px; background:#ffd1e2; }
.lid {
  position: absolute;
  width: 246px; height: 42px;
  left: 50%; top: 0;
  transform: translateX(-50%) rotate(-2deg);
  border-radius: 12px;
  background: #ff77a7;
  border: 5px solid #d84b7e;
  z-index: 2;
  transition: transform .7s cubic-bezier(.16,1,.3,1), top .7s;
}
.bow { position:absolute; top:-28px; left:50%; transform:translateX(-50%); width:92px; height:56px; z-index:4; }
.bow::before, .bow::after { content:""; position:absolute; width:45px; height:30px; top:12px; background:#ffd1e2; border:4px solid #d84b7e; border-radius: 70% 18% 70% 18%; }
.bow::before { left:2px; transform:rotate(18deg); } .bow::after { right:2px; transform:scaleX(-1) rotate(18deg); }
.bow .knot { position:absolute; width:22px; height:22px; border-radius:50%; background:#ffe1eb; border:4px solid #d84b7e; left:35px; top:18px; z-index:2; }
.gift.open .lid { transform: translateX(-50%) translateY(-56px) rotate(-8deg); top: 0; }
.ribbon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 32px; z-index:3; pointer-events:none; }
.gift-note { font-size: 13px; color:#8c6b7b; margin-top: 5px; }

.fireworks, .confetti { position: fixed; inset: 0; pointer-events:none; z-index: 100; overflow:hidden; }
.spark { position:absolute; left:50%; top:50%; width:7px; height:7px; border-radius:50%; background:#ff6b9c; animation: burst 1.15s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%,-50%) rotate(var(--a)) translateX(0); opacity:1; } to { transform: translate(-50%,-50%) rotate(var(--a)) translateX(230px); opacity:0; } }
.confetti span { position:absolute; width: 10px; height:16px; top:-20px; border-radius: 3px; animation: drop 2.4s linear forwards; }
@keyframes drop { to { transform: translateY(110vh) rotate(520deg); } }

.toast {
  position: fixed;
  left: 50%; bottom: 24px;
  transform: translate(-50%, 140%);
  background: #3f2c3c;
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  z-index: 120;
  box-shadow: 0 14px 30px rgba(0,0,0,.2);
  transition: transform .3s ease;
  font-weight: 800;
  font-size: 13px;
}
.toast.show { transform: translate(-50%, 0); }

.reveal {
  text-align:center;
  padding: 8px 6px 6px;
}
.reveal .big { font-size: clamp(54px, 12vw, 96px); animation: laugh .9s ease both; }
@keyframes laugh { from { transform: scale(.5) rotate(-8deg); opacity:0; } to { transform: scale(1) rotate(0); opacity:1; } }
.reveal h2 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 8px; color:#e54d80; }
.reveal p { color: var(--muted); font-size: 16px; max-width: 580px; margin: 0 auto 18px; line-height:1.6; }
.little-card { background: #fff; border: 1px solid #f3dce7; border-radius: 24px; padding: 18px; max-width: 560px; margin: 0 auto; box-shadow: 0 12px 28px rgba(93,58,75,.08); }

.tear { animation: tear 1.1s ease-in-out infinite alternate; }
@keyframes tear { from { transform: translateY(0); } to { transform: translateY(5px); } }
.shake { animation: shake .5s ease-in-out 2; }
@keyframes shake { 25% { transform: translateX(-8px) rotate(-2deg); } 50% { transform: translateX(8px) rotate(2deg); } 75% { transform: translateX(-5px) rotate(-1deg); } }

.footerline { text-align:center; margin-top: 22px; color:#aa8f9e; font-size:11px; position:relative; z-index:2; }

@media (max-width: 620px) {
  .card { padding: 20px 15px 24px; border-radius: 28px; }
  .bears { transform: scale(.88); margin-top: 4px; }
  .choice-grid { grid-template-columns: 1fr; }
  .actions { min-height: 150px; }
  .actions.dodge-zone .btn.no { left: 55%; top: 72%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* comedy-game upgrade */
.progress-wrap{margin:14px auto 0;max-width:520px;text-align:left}.progress-label{font-size:12px;font-weight:800;color:#9b5878;margin-bottom:5px}.progress{height:10px;background:#ffe1ed;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px #d99}.progress>i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#ff6f9e,#b87cff);border-radius:99px;transition:width .7s}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#351d32;color:white;padding:12px 18px;border-radius:18px;font-weight:800;z-index:99;pointer-events:none;transition:.3s;box-shadow:0 10px 30px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}.ticker{margin-top:12px;padding:9px 12px;border-radius:14px;background:#fff0f7;border:1px dashed #f3a1bd;font-size:12px;font-weight:800;color:#a34f76;overflow:hidden}.ticker span{display:inline-block;white-space:nowrap;animation:marquee 9s linear infinite}@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}.cry{font-size:64px;animation:shake .45s infinite alternate}@keyframes shake{to{transform:translateX(7px) rotate(-4deg)}}.dance{font-size:60px;animation:dance .55s infinite alternate}@keyframes dance{to{transform:rotate(8deg) translateY(-8px)}}.fake-load{font-family:ui-monospace,monospace;background:#251a29;color:#ffd8e7;border-radius:15px;padding:13px;text-align:left;line-height:1.8;margin:14px 0}.gift-note{font-weight:900;color:#b05079;margin:10px}.badge{display:inline-block;padding:7px 11px;border-radius:99px;background:#fff1a9;font-weight:900;color:#795500;margin:5px}.
</style>
</head>
<body>
<div id="app"><div class="progress-wrap"><div class="progress-label">LOVE TEST™ — probably scientifically accurate</div><div class="progress"><i id="progressBar"></i></div></div>
<div class="ticker"><span>🚨 BREAKING: Phuttuuuuuu has entered Shubham’s extremely serious emotional examination 🚨</span></div></div>
<script>
const app = document.getElementById('app');
let noDodges = 0;
let page = 'home';

const bearScene = (crying=false) => `
  <div class="bears ${crying ? 'shake' : ''}">
    <div class="bear" aria-hidden="true">
      <span class="ear left"></span><span class="ear right"></span><span class="head"></span>
      <span class="eye left"></span><span class="eye right"></span><span class="muzzle"></span><span class="nose"></span><span class="smile"></span>
      <span class="body"></span><span class="arm left"></span><span class="arm right"></span><span class="heart">💗</span>
    </div>
    <div class="bear blue" aria-hidden="true">
      <span class="ear left"></span><span class="ear right"></span><span class="head"></span>
      <span class="eye left"></span><span class="eye right"></span><span class="muzzle"></span><span class="nose"></span><span class="smile"></span>
      <span class="body"></span><span class="arm left"></span><span class="arm right"></span>
      ${crying ? '<span class="tear" style="position:absolute;left:28px;top:63px;font-size:22px">💧</span><span class="tear" style="position:absolute;right:23px;top:64px;font-size:22px">💧</span>' : ''}
    </div>
  </div>`;

function shell(inner, step='1 / 3') {
  return `<main class="scene"><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <section class="card">
      <div class="topline"><div class="brand">BUBU 💗 DUDU</div><div class="progress">little love game · ${step}</div></div>
      ${inner}
    </section>
  </main>`;
}

function homePage() {
  page='home'; noDodges=0;
  app.innerHTML = shell(`${bearScene()}
    <div class="kicker">a tiny question for you</div>
    <h1>Phuttuuuuuu…<br>do you love me? 🥺💗</h1>
    <p class="sub">Bubu and Dudu are waiting very seriously for your answer. Choose wisely… one tiny button may have a mind of its own. 😌</p>
    <div class="actions dodge-zone" id="actionArea">
      <button class="btn yes" id="yesBtn">YES 💗</button>
      <button class="btn no" id="noBtn">NO 🙈</button>
    </div>
    <div class="hint" id="hint">Psst… there is definitely a correct answer.</div>
    <div class="footerline">made with too many hearts, one suspicious button, and a tiny prank 🎀</div>`);

  document.getElementById('yesBtn').addEventListener('click', () => question2());
  const noBtn = document.getElementById('noBtn');
  const area = document.getElementById('actionArea');
  const dodge = () => {
    noDodges++;
    const pad = 10;
    const w = Math.max(120, window.innerWidth - noBtn.offsetWidth - 24);
    const h = Math.max(160, window.innerHeight - noBtn.offsetHeight - 24);
    const x = pad + Math.random() * (w - pad * 2);
    const y = pad + Math.random() * (h - pad * 2);
    noBtn.style.position='fixed';
    noBtn.style.left=x+'px'; noBtn.style.top=y+'px';
    noBtn.style.transform='rotate(' + ((Math.random()*14)-7) + 'deg)';
    document.getElementById('hint').textContent = noDodges < 4 ? 'Hehe… the NO button is shy. Try again. 😭' : 'Okayyyy 😂 Bubu says NO is currently unavailable.';
  };
  ['mouseenter','pointerdown','touchstart','focus'].forEach(evt => noBtn.addEventListener(evt, (e)=>{ e.preventDefault(); dodge(); }));
  noBtn.addEventListener('click', e => { e.preventDefault(); dodge(); });
}

function question2() {
  page='q2';
  app.innerHTML = shell(`${bearScene()}
    <div class="kicker">level 2 · very important</div>
    <h1>Whom does Shubham love the most? 💌</h1>
    <p class="sub">This answer unlocks what Bubu and Dudu have packed inside the mystery gift. No pressure. 👀</p>
    <div class="choice-grid">
      <button class="choice me" id="meChoice"><span class="emoji">🥰</span>Me</button>
      <button class="choice rain" id="rainChoice"><span class="emoji">🌧️</span>Rain</button>
    </div>
    <div class="hint">One option gets fireworks. One option gets… very dramatic tears. 😂</div>`,'2 / 3');
  document.getElementById('meChoice').addEventListener('click', () => correctAnswer());
  document.getElementById('rainChoice').addEventListener('click', () => wrongAnswer());
}

function wrongAnswer() {
  app.innerHTML = shell(`${bearScene(true)}
    <div class="kicker">oh nooooo 😭</div>
    <h1>Rain?! 🌧️</h1>
    <p class="sub">Bubu & Dudu are crying because that was <strong>not</strong> the answer. They were ready with a celebration! 🥺💧</p>
    <div class="little-card"><strong>System message:</strong> dramatic bear sadness activated.</div>
    <button class="back" id="returnHome">↩ Take me back to the first question</button>
    <div class="hint">Redirecting you back to the YES / NO page in a moment…</div>`,'2 / 3');
  setTimeout(() => { if (page === 'q2') homePage(); }, 3200);
  document.getElementById('returnHome').addEventListener('click', homePage);
}

function correctAnswer() {
  page='gift';
  fireworkBurst();
  setTimeout(() => {
    app.innerHTML = shell(`${bearScene()}
      <div class="kicker">correct answer!! 🎉</div>
      <h1>YAYYY! You chose “Me”. 💗</h1>
      <p class="sub">Bubu and Dudu are celebrating because you got it right. Now there is just one tiny thing left…</p>
      <div class="gift-wrap">
        <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">
          <div class="lid"><div class="bow"><span class="knot"></span></div></div>
          <div class="ribbon">🎁</div>
        </div>
      </div>
      <div class="hint">Tap the gift box to open it. 🎀</div>`,'3 / 3');
    const gift = document.getElementById('gift');
    gift.addEventListener('click', openGift);
    gift.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
  }, 900);
}

function openGift() {
  const gift=document.getElementById('gift');
  if (!gift || gift.classList.contains('open')) return;
  gift.classList.add('open');
  confetti();
  setTimeout(() => reveal(), 850);
}

function reveal() {
  page='reveal';
  app.innerHTML = shell(`${bearScene()}
    <div class="reveal">
      <div class="big">😂😂😂</div>
      <h2>APRIL FOOL! 🎀</h2>
      <p>You actually made it all the way through the Bubu Dudu love mission. 😭💗 The “gift” was just a tiny prank… but the cute memories are real.</p>
      <div class="little-card"><strong>Phuttuuuuuu 💗</strong><br>Congratulations. You passed the most suspicious love quiz on the internet.</div>
      <div style="margin-top:18px"><button class="btn yes" id="again">Play it again 💞</button></div>
    </div>
    <div class="footerline">Bubu & Dudu approve this prank. ✨</div>`,'∞');
  document.getElementById('again').addEventListener('click', homePage);
}

function fireworkBurst() {
  const layer=document.createElement('div'); layer.className='fireworks';
  for(let i=0;i<34;i++) {
    const s=document.createElement('i'); s.className='spark'; s.style.setProperty('--a',(i*10.6)+'deg');
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),1500);
}
function confetti() {
  const layer=document.createElement('div'); layer.className='confetti';
  const glyphs=['💗','✨','🎀','💞','⭐','🌸','😂'];
  for(let i=0;i<44;i++) {
    const s=document.createElement('span');
